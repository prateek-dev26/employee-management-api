services:

  mysql:
    image: mysql:8.0
    container_name: employee-mysql

    environment:
      MYSQL_ROOT_PASSWORD: Prateek@2005
      MYSQL_DATABASE: employee_db

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pPrateek@2005"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  employee-management-api:
    build: .
    container_name: employee-management-api

    ports:
      - "8080:8080"

    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data: